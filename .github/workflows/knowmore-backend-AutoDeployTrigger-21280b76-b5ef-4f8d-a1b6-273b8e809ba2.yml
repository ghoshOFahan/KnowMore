name: Build and deploy KnowMore backend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.KNOWMOREBACKEND_REGISTRY_USERNAME }}
          password: ${{ secrets.KNOWMOREBACKEND_REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            aintlucifer/knowmore-backend:latest
            aintlucifer/knowmore-backend:${{ github.sha }}

      - name: Deploy to Lightsail
        env:
          SSH_HOST: ${{ secrets.KNOWMORE_SSH_HOST }}
          SSH_KEY: ${{ secrets.KNOWMORE_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.KNOWMORE_SSH_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/knowmore
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/knowmore ~/.ssh/known_hosts
          scp -i ~/.ssh/knowmore -o StrictHostKeyChecking=yes docker-compose.yml Caddyfile "ubuntu@$SSH_HOST:/opt/knowmore/"
          ssh -i ~/.ssh/knowmore -o StrictHostKeyChecking=yes "ubuntu@$SSH_HOST" 'cd /opt/knowmore && docker compose pull && docker compose up -d'
